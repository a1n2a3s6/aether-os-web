        newInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') createNew();
          if (e.key === 'Escape') newBar.classList.add('hidden');
        });

        const unsub = EventBus.on('vfs:change', () => {
          populateFileSelect();
        });

        loadFile(currentFile);
        updatePreviewBtn();

        return {
          onParams(p) {
            if (p && p.filePath) loadFile(p.filePath);
          },
          onClose() { unsub(); }
        };
      }

      /* ---------------------------------------------------------------------
         APP 4: SYNTHWAVE (Web Audio Polyphonic Synthesizer + Oscilloscope)
         --------------------------------------------------------------------- */
      function mountSynthWave(win) {
        let audioCtx = null;
        let masterGain = null;
        let filterNode = null;
        let analyser = null;
        let waveform = 'sawtooth';
        let cutoffHz = 2800;
        let rafId = null;
        let isFocused = true;
        const activeVoices = new Map(); // note -> { osc, gain }

        const NOTES = [
          { note: 'C4',  freq: 261.63, key: 'a', black: false },
          { note: 'C#4', freq: 277.18, key: 'w', black: true  },
          { note: 'D4',  freq: 293.66, key: 's', black: false },
          { note: 'D#4', freq: 311.13, key: 'e', black: true  },
          { note: 'E4',  freq: 329.63, key: 'd', black: false },
          { note: 'F4',  freq: 349.23, key: 'f', black: false },
          { note: 'F#4', freq: 369.99, key: 't', black: true  },
          { note: 'G4',  freq: 392.00, key: 'g', black: false },
          { note: 'G#4', freq: 415.30, key: 'y', black: true  },
          { note: 'A4',  freq: 440.00, key: 'h', black: false },
          { note: 'A#4', freq: 466.16, key: 'u', black: true  },
          { note: 'B4',  freq: 493.88, key: 'j', black: false },
          { note: 'C5',  freq: 523.25, key: 'k', black: false },
          { note: 'C#5', freq: 554.37, key: 'o', black: true  },
          { note: 'D5',  freq: 587.33, key: 'l', black: false },
          { note: 'D#5', freq: 622.25, key: 'p', black: true  },
          { note: 'E5',  freq: 659.25, key: ';', black: false }
        ];

        win.bodyEl.innerHTML = `
          <div class="flex-1 flex flex-col min-h-0 bg-gradient-to-b from-[#0b0e1d] to-[#060812] p-3.5 gap-3 overflow-y-auto">
            <!-- Oscilloscope Visualizer -->
            <div class="relative h-28 sm:h-32 w-full rounded-xl bg-black/60 border border-indigo-400/25 overflow-hidden shrink-0">
              <canvas class="synth-scope w-full h-full block"></canvas>
              <div class="absolute top-2 left-3 text-[10px] font-mono uppercase tracking-wider text-indigo-300/80">Oscilloscope • Web Audio API</div>
              <div class="synth-active-note absolute top-2 right-3 text-[10px] font-mono text-sky-300">Ready</div>
            </div>

            <!-- Controls Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 shrink-0">
              <!-- Waveform Selector -->
              <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/10">
                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-2">Oscillator Waveform</div>
                <div class="grid grid-cols-4 gap-1.5">
                  ${['sine', 'sawtooth', 'square', 'triangle'].map(wf => `
                    <button data-wf="${wf}" class="synth-wf-btn py-1.5 rounded-lg text-[11px] font-medium capitalize border transition-colors ${wf === waveform ? 'bg-indigo-500/35 border-indigo-400 text-white' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}">${wf}</button>
                  `).join('')}
                </div>
              </div>

              <!-- Low-Pass Filter Cutoff -->
              <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/10 flex flex-col justify-between">
                <div class="flex items-center justify-between text-[10px] uppercase tracking-wider font-semibold mb-1">
                  <span class="text-slate-400">Low-Pass Filter Cutoff</span>
                  <span class="synth-cutoff-val font-mono text-sky-300">${cutoffHz} Hz</span>
                </div>
                <input type="range" min="120" max="12000" step="10" value="${cutoffHz}" class="synth-cutoff w-full accent-sky-400 cursor-pointer" />
                <div class="flex justify-between text-[9px] font-mono text-slate-500 mt-0.5">
                  <span>120 Hz</span><span>Warm</span><span>12 kHz</span>
                </div>
              </div>
            </div>

            <!-- Polyphonic Piano Keyboard -->
            <div class="flex-1 min-h-[125px] flex flex-col justify-end">
              <div class="text-[10px] text-slate-400 mb-1.5 flex items-center justify-between">
                <span>Click keys or use computer keyboard (<span class="font-mono text-sky-300">A–;</span> &amp; <span class="font-mono text-indigo-300">W E T Y U O P</span>)</span>
              </div>
              <div class="synth-keyboard relative w-full h-32 select-none flex"></div>
            </div>
          </div>
        `;

        const scopeCanvas = win.bodyEl.querySelector('.synth-scope');
        const scopeCtx = scopeCanvas.getContext('2d');
        const activeNoteLabel = win.bodyEl.querySelector('.synth-active-note');
        const cutoffSlider = win.bodyEl.querySelector('.synth-cutoff');
        const cutoffLabel = win.bodyEl.querySelector('.synth-cutoff-val');
        const kbContainer = win.bodyEl.querySelector('.synth-keyboard');

        // Build Piano UI
        const whiteNotes = NOTES.filter(n => !n.black);
        const whiteWidthPct = 100 / whiteNotes.length;
        const keyEls = new Map();

        whiteNotes.forEach((n) => {
          const btn = document.createElement('button');
          btn.className = 'piano-white relative flex-1 h-full flex flex-col items-center justify-end pb-2 text-slate-600 focus:outline-none';
          btn.innerHTML = `<span class="text-[10px] font-bold font-mono uppercase text-slate-500">${n.key}</span><span class="text-[9px] text-slate-400">${n.note}</span>`;
          kbContainer.appendChild(btn);
          keyEls.set(n.note, btn);
          bindKeyPointer(btn, n);
        });

        // Position black keys cleanly over white keys
        let whiteIdx = -1;
        NOTES.forEach((n) => {
          if (!n.black) { whiteIdx++; return; }
          const btn = document.createElement('button');
          btn.className = 'piano-black absolute top-0 h-[62%] z-10 flex flex-col items-center justify-end pb-1.5 text-slate-300 focus:outline-none';
          btn.style.width = `${whiteWidthPct * 0.62}%`;
          btn.style.left = `${(whiteIdx + 1) * whiteWidthPct - (whiteWidthPct * 0.31)}%`;
          btn.innerHTML = `<span class="text-[9px] font-bold font-mono uppercase text-indigo-200">${n.key}</span>`;
          kbContainer.appendChild(btn);
          keyEls.set(n.note, btn);
          bindKeyPointer(btn, n);
        });

        function ensureAudio() {
          if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioCtx();
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.value = cutoffHz;
            filterNode.Q.value = 3.2;

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.28;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;

            filterNode.connect(masterGain);
            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }

        function noteOn(noteObj) {
          if (activeVoices.has(noteObj.note)) return;
          ensureAudio();

          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = waveform;
          osc.frequency.setValueAtTime(noteObj.freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.45, now + 0.02);

          osc.connect(gain);
          gain.connect(filterNode);
          osc.start(now);

          activeVoices.set(noteObj.note, { osc, gain });
          const el = keyEls.get(noteObj.note);
          if (el) el.classList.add('active');
          activeNoteLabel.textContent = Array.from(activeVoices.keys()).join(' + ');
        }

        function noteOff(noteObj) {
          const voice = activeVoices.get(noteObj.note);
          if (!voice || !audioCtx) return;
          const now = audioCtx.currentTime;
          voice.gain.gain.cancelScheduledValues(now);
          voice.gain.gain.setValueAtTime(Math.max(0.001, voice.gain.gain.value), now);
          voice.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          voice.osc.stop(now + 0.16);
          activeVoices.delete(noteObj.note);

          const el = keyEls.get(noteObj.note);
          if (el) el.classList.remove('active');
          activeNoteLabel.textContent = activeVoices.size ? Array.from(activeVoices.keys()).join(' + ') : 'Ready';
        }

        function bindKeyPointer(btn, noteObj) {
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            noteOn(noteObj);
          });
          const stop = () => noteOff(noteObj);
          btn.addEventListener('pointerup', stop);
          btn.addEventListener('pointerleave', stop);
          btn.addEventListener('pointercancel', stop);
        }

        // Waveform buttons
        win.bodyEl.querySelectorAll('.synth-wf-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            waveform = btn.dataset.wf;
            win.bodyEl.querySelectorAll('.synth-wf-btn').forEach(b => {
              const active = b.dataset.wf === waveform;
              b.className = `synth-wf-btn py-1.5 rounded-lg text-[11px] font-medium capitalize border transition-colors ${active ? 'bg-indigo-500/35 border-indigo-400 text-white' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}`;
            });
          });
        });

        // Filter cutoff slider
        cutoffSlider.addEventListener('input', () => {
          cutoffHz = Number(cutoffSlider.value);
          cutoffLabel.textContent = `${cutoffHz} Hz`;
          if (filterNode && audioCtx) {
            filterNode.frequency.setTargetAtTime(cutoffHz, audioCtx.currentTime, 0.02);
          }
        });

        // Computer Keyboard Playback (only when SynthWave window is focused)
        const onKeyDown = (e) => {
          if (!isFocused || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
          if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
          const noteObj = NOTES.find(n => n.key === e.key.toLowerCase());
          if (noteObj) {
            e.preventDefault();
            noteOn(noteObj);
          }
        };
        const onKeyUp = (e) => {
          const noteObj = NOTES.find(n => n.key === e.key.toLowerCase());
          if (noteObj) noteOff(noteObj);
        };
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        // Live Oscilloscope Canvas Loop
        const resizeScope = () => {
          const rect = scopeCanvas.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            scopeCanvas.width = rect.width * dpr;
            scopeCanvas.height = rect.height * dpr;
            scopeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }
        };
        resizeScope();

        const drawScope = () => {
          const w = scopeCanvas.clientWidth;
          const h = scopeCanvas.clientHeight;
          scopeCtx.clearRect(0, 0, w, h);

          // Grid
          scopeCtx.strokeStyle = 'rgba(129, 140, 248, 0.12)';
          scopeCtx.lineWidth = 1;
          scopeCtx.beginPath();
          scopeCtx.moveTo(0, h / 2);
          scopeCtx.lineTo(w, h / 2);
          scopeCtx.stroke();

          scopeCtx.lineWidth = 2;
          scopeCtx.strokeStyle = '#38bdf8';
          scopeCtx.shadowColor = '#38bdf8';
          scopeCtx.shadowBlur = 8;
          scopeCtx.beginPath();

          if (analyser) {
            const buf = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(buf);
            const slice = w / buf.length;
            for (let i = 0; i < buf.length; i++) {
              const v = buf[i] / 128.0;
              const y = (v * h) / 2;
              if (i === 0) scopeCtx.moveTo(0, y);
              else scopeCtx.lineTo(i * slice, y);
            }
          } else {
            scopeCtx.moveTo(0, h / 2);
            scopeCtx.lineTo(w, h / 2);
          }
          scopeCtx.stroke();
          scopeCtx.shadowBlur = 0;

          rafId = requestAnimationFrame(drawScope);
        };
        drawScope();

        return {
          onFocus() { isFocused = true; },
          onBlur() { isFocused = false; },
          onResize() { resizeScope(); },
          onClose() {
            cancelAnimationFrame(rafId);
            window.removeEventListener('keydown', onKeyDown);
            window.removeEventListener('keyup', onKeyUp);
            for (const n of NOTES) noteOff(n);
            if (audioCtx && audioCtx.state !== 'closed') {
              audioCtx.close().catch(() => {});
            }
          }
        };
      }

      /* ---------------------------------------------------------------------
         APP 5: SYSMON (System Monitor + Live Process Killer)
         --------------------------------------------------------------------- */
      function mountSysMon(win) {
        const HISTORY_LEN = 40;
        const cpuData = Array(HISTORY_LEN).fill(18);
        const memData = Array(HISTORY_LEN).fill(42);
        const netData = Array(HISTORY_LEN).fill(12);

        win.bodyEl.innerHTML = `
          <div class="flex-1 flex flex-col min-h-0 bg-slate-950/60 p-3.5 gap-3 overflow-y-auto">
            <!-- Telemetry Charts -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 shrink-0">
              <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/10">
                <div class="flex justify-between items-center mb-1.5">
                  <span class="text-[11px] font-semibold text-slate-300">CPU Load</span>
                  <span class="sm-cpu-val font-mono text-xs text-sky-400">18%</span>
                </div>
                <canvas class="sm-cpu-canvas w-full h-20 block rounded-lg bg-black/40"></canvas>
              </div>
              <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/10">
                <div class="flex justify-between items-center mb-1.5">
                  <span class="text-[11px] font-semibold text-slate-300">Memory</span>
                  <span class="sm-mem-val font-mono text-xs text-indigo-400">3.4 / 8 GB</span>
                </div>
                <canvas class="sm-mem-canvas w-full h-20 block rounded-lg bg-black/40"></canvas>
              </div>
              <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/10">
                <div class="flex justify-between items-center mb-1.5">
                  <span class="text-[11px] font-semibold text-slate-300">Network I/O</span>
                  <span class="sm-net-val font-mono text-xs text-emerald-400">12 Mbps</span>
                </div>
                <canvas class="sm-net-canvas w-full h-20 block rounded-lg bg-black/40"></canvas>
              </div>
            </div>

            <!-- Active Processes Table -->
            <div class="flex-1 min-h-[160px] rounded-xl bg-white/[0.025] border border-white/10 flex flex-col overflow-hidden">
              <div class="px-3 py-2 border-b border-white/10 flex items-center justify-between bg-white/[0.02]">
                <span class="text-xs font-semibold text-slate-200">Active Processes</span>
                <span class="sm-proc-count text-[11px] font-mono text-slate-400">0 running</span>
              </div>
              <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left text-xs">
                  <thead class="text-[10px] uppercase tracking-wider text-slate-400 bg-white/[0.02] sticky top-0">
                    <tr>
                      <th class="px-3 py-2">PID</th>
                      <th class="px-3 py-2">Application</th>
                      <th class="px-3 py-2 hidden sm:table-cell">State</th>
                      <th class="px-3 py-2">CPU / RAM</th>
                      <th class="px-3 py-2 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody class="sm-proc-body divide-y divide-white/5"></tbody>
                </table>
              </div>
            </div>
          </div>
        `;

        const cpuCanvas = win.bodyEl.querySelector('.sm-cpu-canvas');
        const memCanvas = win.bodyEl.querySelector('.sm-mem-canvas');
        const netCanvas = win.bodyEl.querySelector('.sm-net-canvas');
        const cpuVal = win.bodyEl.querySelector('.sm-cpu-val');
        const memVal = win.bodyEl.querySelector('.sm-mem-val');
        const netVal = win.bodyEl.querySelector('.sm-net-val');
        const procBody = win.bodyEl.querySelector('.sm-proc-body');
        const procCount = win.bodyEl.querySelector('.sm-proc-count');

        const drawChart = (canvas, data, strokeColor, fillColor) => {
          const rect = canvas.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          if (canvas.width !== Math.round(rect.width * dpr) || canvas.height !== Math.round(rect.height * dpr)) {
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
          }
          const ctx = canvas.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const w = rect.width;
          const h = rect.height;

          ctx.clearRect(0, 0, w, h);

          // Subtle grid
          ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          ctx.lineWidth = 1;
          for (let y = 1; y < 4; y++) {
            ctx.beginPath();
            ctx.moveTo(0, (h / 4) * y);
            ctx.lineTo(w, (h / 4) * y);
            ctx.stroke();
          }

          // Line & fill
          const step = w / (data.length - 1);
          ctx.beginPath();
          data.forEach((v, i) => {
            const x = i * step;
            const y = h - (Math.max(0, Math.min(100, v)) / 100) * (h - 8) - 4;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.lineTo(w, h);
          ctx.lineTo(0, h);
          ctx.closePath();
          const grad = ctx.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, fillColor);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grad;
          ctx.fill();
        };

        const renderProcesses = () => {
          const wins = Array.from(WindowManager.windows.values());
          procCount.textContent = `${wins.length} running`;
          procBody.innerHTML = wins.map(w => {
            const simCpu = (2.1 + ((w.pid * 7) % 14) + Math.random() * 1.5).toFixed(1);
            const simRam = 38 + ((w.pid * 19) % 110);
            const stateBadge = w.minimized
              ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px]">Minimized</span>'
              : '<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px]">Running</span>';
            return `
              <tr class="hover:bg-white/[0.03]">
                <td class="px-3 py-2 font-mono text-slate-400">${w.pid}</td>
                <td class="px-3 py-2 font-medium text-slate-100 truncate max-w-[160px]">${Utils.escapeHtml(w.title)}</td>
                <td class="px-3 py-2 hidden sm:table-cell">${stateBadge}</td>
                <td class="px-3 py-2 font-mono text-[11px] text-slate-300">${simCpu}% • ${simRam}MB</td>
                <td class="px-3 py-2 text-right">
                  <button data-kill="${w.id}" class="sm-kill-btn px-2 py-0.5 rounded-md bg-rose-500/20 hover:bg-rose-500/40 border border-rose-400/30 text-rose-300 text-[11px] font-medium transition-colors">Kill</button>
                </td>
              </tr>
            `;
          }).join('');

          procBody.querySelectorAll('.sm-kill-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const targetId = btn.dataset.kill;
              WindowManager.close(targetId);
              Utils.toast('Process terminated', 'info');
            });
          });
        };

        const tick = () => {
          const loadBase = 10 + WindowManager.windows.size * 5;
          const nextCpu = Math.max(5, Math.min(95, cpuData[cpuData.length - 1] + (Math.random() - 0.48) * 14 + (loadBase - cpuData[cpuData.length - 1]) * 0.2));
          const nextMem = Math.max(20, Math.min(90, 32 + WindowManager.windows.size * 6 + (Math.random() - 0.5) * 4));
          const nextNet = Math.max(2, Math.min(96, netData[netData.length - 1] * 0.65 + Math.random() * 35));

          cpuData.push(nextCpu); cpuData.shift();
          memData.push(nextMem); memData.shift();
          netData.push(nextNet); netData.shift();

          cpuVal.textContent = `${Math.round(nextCpu)}%`;
          memVal.textContent = `${((nextMem / 100) * 8).toFixed(1)} / 8 GB`;
          netVal.textContent = `${(nextNet * 1.4).toFixed(1)} Mbps`;

          drawChart(cpuCanvas, cpuData, '#38bdf8', 'rgba(56, 189, 248, 0.28)');
          drawChart(memCanvas, memData, '#818cf8', 'rgba(129, 140, 248, 0.28)');
          drawChart(netCanvas, netData, '#34d399', 'rgba(52, 211, 153, 0.28)');
        };

        const intervalId = setInterval(tick, 900);
        const unsub = EventBus.on('wm:change', renderProcesses);

        // Initial paint
        setTimeout(() => { tick(); renderProcesses(); }, 30);

        return {
          onResize() { tick(); },
          onClose() {
            clearInterval(intervalId);
            unsub();
          }
        };
      }

      /* =====================================================================
         SECTION 6: APP REGISTRY & DOCK CONTROLLER
         ===================================================================== */
      const AppRegistry = {
        terminal: {
          id: 'terminal',
          title: 'Terminal',
          defaultWidth: 660,
          defaultHeight: 430,
          minWidth: 340,
          minHeight: 240,
          singleton: false,
          iconBg: 'from-emerald-500/30 to-teal-600/40 border-emerald-400/40',
          iconSvg: `<span class="font-mono font-bold text-lg text-emerald-300">&gt;_</span>`,
          mount: mountTerminal
        },
        files: {
          id: 'files',
          title: 'Files',
          defaultWidth: 680,
          defaultHeight: 450,
          minWidth: 360,
          minHeight: 280,
          singleton: true,
          iconBg: 'from-amber-400/30 to-orange-500/40 border-amber-400/40',
          iconSvg: `<svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>`,
          mount: mountFiles
        },
        codepad: {
          id: 'codepad',
          title: 'CodePad',
          defaultWidth: 760,
          defaultHeight: 490,
          minWidth: 380,
          minHeight: 300,
          singleton: true,
          iconBg: 'from-sky-500/30 to-blue-600/40 border-sky-400/40',
          iconSvg: `<svg class="w-6 h-6 text-sky-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>`,
          mount: mountCodePad
        },
        synthwave: {
          id: 'synthwave',
          title: 'SynthWave',
          defaultWidth: 660,
          defaultHeight: 470,
          minWidth: 420,
          minHeight: 380,
          singleton: true,
          iconBg: 'from-fuchsia-500/30 to-indigo-600/40 border-fuchsia-400/40',
          iconSvg: `<svg class="w-6 h-6 text-fuchsia-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/></svg>`,
          mount: mountSynthWave
        },
        sysmon: {
          id: 'sysmon',
          title: 'SysMon',
          defaultWidth: 700,
          defaultHeight: 480,
          minWidth: 380,
          minHeight: 340,
          singleton: true,
          iconBg: 'from-cyan-500/30 to-indigo-600/40 border-cyan-400/40',
          iconSvg: `<svg class="w-6 h-6 text-cyan-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>`,
          mount: mountSysMon
        }
      };

      const Dock = {
        el: null,
        init() {
          this.el = document.getElementById('dock');
          this.render();
          EventBus.on('wm:change', () => this.updateDots());
        },
        render() {
          this.el.innerHTML = Object.values(AppRegistry).map(app => `
            <button data-dock-app="${app.id}" class="dock-item relative flex flex-col items-center group focus:outline-none" aria-label="${app.title}">
              <span class="dock-tooltip absolute -top-9 left-1/2 px-2.5 py-1 rounded-lg bg-slate-900/95 border border-white/15 text-[11px] font-medium text-slate-100 whitespace-nowrap shadow-xl">${app.title}</span>
              <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br ${app.iconBg} border flex items-center justify-center shadow-lg">
                ${app.iconSvg}
              </div>
              <span data-dot="${app.id}" class="w-1.5 h-1.5 rounded-full mt-1 transition-all duration-200 bg-transparent"></span>
            </button>
          `).join('');

          this.el.querySelectorAll('[data-dock-app]').forEach(btn => {
            btn.addEventListener('click', () => WindowManager.handleDockClick(btn.dataset.dockApp));
          });
          this.updateDots();
        },
        updateDots() {
          for (const appId of Object.keys(AppRegistry)) {
            const dot = this.el.querySelector(`[data-dot="${appId}"]`);
            if (!dot) continue;
            const wins = Array.from(WindowManager.windows.values()).filter(w => w.appId === appId);
            if (wins.length === 0) {
              dot.className = 'w-1.5 h-1.5 rounded-full mt-1 transition-all duration-200 bg-transparent';
            } else if (wins.some(w => !w.minimized)) {
              dot.className = 'w-1.5 h-1.5 rounded-full mt-1 transition-all duration-200 bg-sky-400 shadow-[0_0_8px_#38bdf8]';
            } else {
              dot.className = 'w-1.5 h-1.5 rounded-full mt-1 transition-all duration-200 bg-amber-400/80';
            }
          }
        }
      };

      /* =====================================================================
         SECTION 7: SYSTEM BOOTSTRAP (Clock, Top Bar, Shortcuts, Splash)
         ===================================================================== */
      const OS_BOOT_TIME = Date.now();

      function initShell() {
        VFS.init();
        WallpaperEngine.init();
        WindowManager.init();
        Dock.init();

        // Live Clock
        const clockEl = document.getElementById('system-clock');
        const updateClock = () => {
          const now = new Date();
          clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        };
        updateClock();
        setInterval(updateClock, 1000);

        // Wallpaper Switcher Dropdown
        const wpBtn = document.getElementById('wallpaper-btn');
        const wpDropdown = document.getElementById('wallpaper-dropdown');
        wpBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          wpDropdown.classList.toggle('hidden');
        });
        document.querySelectorAll('.wp-option').forEach(opt => {
          opt.addEventListener('click', () => {
            WallpaperEngine.setMode(opt.dataset.wp);
            wpDropdown.classList.add('hidden');
          });
        });
        document.addEventListener('click', () => wpDropdown.classList.add('hidden'));

        // Aether Logo quick toast
        document.getElementById('aether-menu-btn').addEventListener('click', () => {
          Utils.toast('AetherOS v2.4 — All systems operational', 'info');
        });

        // Desktop Shortcuts
        document.querySelectorAll('[data-desktop-open-file]').forEach(btn => {
          btn.addEventListener('dblclick', () => {
            WindowManager.openApp('codepad', { filePath: btn.dataset.desktopOpenFile });
          });
        });
        document.querySelectorAll('[data-desktop-open-app]').forEach(btn => {
          btn.addEventListener('dblclick', () => {
            WindowManager.openApp(btn.dataset.desktopOpenApp);
          });
        });

        // Clicking empty desktop blurs focused window label
        document.getElementById('desktop').addEventListener('pointerdown', (e) => {
          if (e.target.id === 'desktop' || e.target.id === 'desktop-icons') {
            WindowManager.focus(null);
          }
        });

        // 1-Second Animated Boot Splash dismissal
        setTimeout(() => {
          const splash = document.getElementById('boot-splash');
          if (splash) {
            splash.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => splash.remove(), 520);
          }
          Utils.toast('Welcome to AetherOS — Launch apps from the Dock', 'info');
        }, 1000);
      }

      window.addEventListener('DOMContentLoaded', initShell);
    })();
  </script>
