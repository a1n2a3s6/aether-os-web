<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AetherOS — Browser Desktop Environment</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            aether: {
              bg: '#070a12',
              panel: 'rgba(15, 20, 34, 0.72)',
              border: 'rgba(255, 255, 255, 0.11)',
              accent: '#38bdf8',
              violet: '#818cf8',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Base Reset & OS Lock */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070a12;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.28);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.48);
    }

    /* Glassmorphism Utilities */
    .glass-bar {
      background: rgba(10, 14, 26, 0.65);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    }

    .glass-dock {
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .glass-window {
      background: rgba(13, 18, 32, 0.84);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .glass-window.focused {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 28px 75px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(56, 189, 248, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Window Animations */
    .os-window {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, box-shadow 0.2s ease;
      will-change: transform, opacity;
    }
    .os-window.dragging,
    .os-window.resizing {
      transition: none !important;
    }
    .os-window.minimized {
      opacity: 0;
      pointer-events: none;
      transform: translateY(45vh) scale(0.45) !important;
    }
    .os-window.opening {
      animation: winOpen 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes winOpen {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Dock Hover Magnification */
    .dock-item {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.2s ease;
      transform-origin: bottom center;
    }
    .dock-item:hover {
      transform: translateY(-10px) scale(1.24);
      margin-left: 6px;
      margin-right: 6px;
    }
    .dock-item:hover + .dock-item,
    .dock-item:has(+ .dock-item:hover) {
      transform: translateY(-4px) scale(1.08);
      margin-left: 2px;
      margin-right: 2px;
    }
    .dock-tooltip {
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }
    .dock-item:hover .dock-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Boot Splash Progress */
    @keyframes bootProgress {
      0% { width: 0%; }
      60% { width: 78%; }
      100% { width: 100%; }
    }
    .boot-bar-fill {
      animation: bootProgress 0.95s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.55)); }
      50% { filter: drop-shadow(0 0 28px rgba(129, 140, 248, 0.85)); }
    }
    .aether-glow {
      animation: pulseGlow 1.6s ease-in-out infinite;
    }

    /* Markdown Preview Styles */
    .md-preview {
      user-select: text;
      line-height: 1.65;
      color: #cbd5e1;
    }
    .md-preview h1 { font-size: 1.55rem; font-weight: 700; color: #f8fafc; margin: 0.75rem 0 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.35rem; }
    .md-preview h2 { font-size: 1.25rem; font-weight: 600; color: #e2e8f0; margin: 0.9rem 0 0.45rem; }
    .md-preview h3 { font-size: 1.05rem; font-weight: 600; color: #bae6fd; margin: 0.75rem 0 0.35rem; }
    .md-preview p { margin: 0.5rem 0; }
    .md-preview ul, .md-preview ol { margin: 0.5rem 0; padding-left: 1.4rem; }
    .md-preview ul { list-style-type: disc; }
    .md-preview ol { list-style-type: decimal; }
    .md-preview li { margin: 0.2rem 0; }
    .md-preview code { background: rgba(56, 189, 248, 0.14); color: #7dd3fc; padding: 0.12rem 0.35rem; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
    .md-preview pre { background: rgba(2, 6, 23, 0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 0.75rem; overflow-x: auto; margin: 0.65rem 0; }
    .md-preview pre code { background: transparent; color: #e2e8f0; padding: 0; }
    .md-preview blockquote { border-left: 3px solid #38bdf8; padding-left: 0.85rem; margin: 0.65rem 0; color: #94a3b8; font-style: italic; background: rgba(56,189,248,0.05); padding-top: 0.25rem; padding-bottom: 0.25rem; border-radius: 0 6px 6px 0; }
    .md-preview hr { border: 0; border-top: 1px solid rgba(255,255,255,0.12); margin: 1rem 0; }
    .md-preview a { color: #38bdf8; text-decoration: underline; }

    /* Piano Keys */
    .piano-white {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      border: 1px solid #94a3b8;
      border-radius: 0 0 6px 6px;
      transition: background 0.06s ease, transform 0.06s ease;
    }
    .piano-white.active, .piano-white:active {
      background: linear-gradient(180deg, #bae6fd 0%, #38bdf8 100%);
      transform: translateY(2px);
    }
    .piano-black {
      background: linear-gradient(180deg, #1e293b 0%, #020617 100%);
      border: 1px solid #0f172a;
      border-radius: 0 0 5px 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      transition: background 0.06s ease, transform 0.06s ease;
    }
    .piano-black.active, .piano-black:active {
      background: linear-gradient(180deg, #818cf8 0%, #4f46e5 100%);
      transform: translateY(2px);
    }

    /* Selectable text inside terminal & inputs */
    .selectable, input, textarea {
      user-select: text;
    }
  </style>
</head>

  <!-- ==================== 6. CORE OS & APPS JAVASCRIPT ==================== -->
  <script>
    (() => {
      'use strict';

      /* =====================================================================
         SECTION 1: EVENT BUS & UTILITIES
         ===================================================================== */
      const EventBus = {
        listeners: {},
        on(event, fn) {
          if (!this.listeners[event]) this.listeners[event] = new Set();
          this.listeners[event].add(fn);
          return () => this.off(event, fn);
        },
        off(event, fn) {
          if (this.listeners[event]) this.listeners[event].delete(fn);
        },
        emit(event, payload) {
          if (this.listeners[event]) {
            this.listeners[event].forEach(fn => {
              try { fn(payload); } catch (err) { console.error(`[EventBus:${event}]`, err); }
            });
          }
        }
      };

      const Utils = {
        escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        },
        formatBytes(bytes) {
          if (bytes < 1024) return `${bytes} B`;
          if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
          return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        },
        formatDate(ts) {
          const d = new Date(ts || Date.now());
          return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
                 d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        },
        toast(message, type = 'info') {
          const container = document.getElementById('toast-container');
          if (!container) return;
          const colors = {
            info: 'border-sky-400/40 text-sky-200',
            success: 'border-emerald-400/40 text-emerald-200',
            error: 'border-rose-400/40 text-rose-200'
          };
          const el = document.createElement('div');
          el.className = `glass-window px-3.5 py-2 rounded-xl text-xs font-medium border ${colors[type] || colors.info} shadow-xl transition-all duration-300 translate-x-6 opacity-0`;
          el.textContent = message;
          container.appendChild(el);
          requestAnimationFrame(() => {
            el.classList.remove('translate-x-6', 'opacity-0');
          });
          setTimeout(() => {
            el.classList.add('translate-x-6', 'opacity-0');
            setTimeout(() => el.remove(), 300);
          }, 2600);
        }
      };

      /* =====================================================================
         SECTION 2: SHARED VIRTUAL FILESYSTEM (localStorage backed)
         ===================================================================== */
      const VFS_STORAGE_KEY = 'aetheros_vfs_v1';

      function createDefaultTree() {
        const now = Date.now();
        return {
          type: 'dir',
          updatedAt: now,
          children: {
            home: {
              type: 'dir',
              updatedAt: now,
              children: {
                guest: {
                  type: 'dir',
                  updatedAt: now,
                  children: {
                    'welcome.md': {
                      type: 'file',
                      updatedAt: now,
                      content: `# Welcome to AetherOS\n\nAetherOS is a self-contained **browser Desktop Operating System** running entirely in a single HTML file.\n\n## Included Applications\n- **Terminal (\`>_\`)**: Unix-style CLI with shared filesystem, command history, and \`neofetch\`.\n- **Files**: Visual file explorer with breadcrumbs and instant sync.\n- **CodePad**: Markdown & text editor with live split-screen preview.\n- **SynthWave**: Polyphonic Web Audio synthesizer with live oscilloscope.\n- **SysMon**: Real-time system telemetry and live process manager.\n\n## Try This\n1. Open **Terminal** and run \`neofetch\` or \`ls\`. \n2. Create a file using \`echo "Hello Aether" > hello.txt\`.\n3. Open it immediately in **Files** or run \`open hello.txt\`!\n\n> Tip: Press **Ctrl+S** (or **Cmd+S**) inside CodePad to save changes directly to persistent localStorage.`
                    },
                    'todo.txt': {
                      type: 'file',
                      updatedAt: now,
                      content: `AetherOS Daily Checklist\n========================\n[x] Boot AetherOS Kernel v2.4\n[x] Switch wallpapers from the Top Menu Bar\n[ ] Run 'neofetch' in Terminal\n[ ] Play a synth melody in SynthWave\n[ ] Inspect & terminate a process in SysMon\n`
                    },
                    Documents: {
                      type: 'dir',
                      updatedAt: now,
                      children: {
                        'aether-specs.md': {
                          type: 'file',
                          updatedAt: now,

      const VFS = {
        root: null,
        init() {
          try {
            const saved = localStorage.getItem(VFS_STORAGE_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed && parsed.type === 'dir' && parsed.children) {
                this.root = parsed;
                return;
              }
            }
          } catch (e) {
            console.warn('VFS load failed, restoring defaults', e);
          }
          this.root = createDefaultTree();
          this.persist();
        },
        persist() {
          try {
            localStorage.setItem(VFS_STORAGE_KEY, JSON.stringify(this.root));
          } catch (e) {
            console.warn('VFS persist failed:', e);
          }
          EventBus.emit('vfs:change');
        },
        normalizePath(cwd, target) {
          let raw = (target || '').trim();
          if (!raw) return cwd || '/home/guest';
          if (raw === '~') raw = '/home/guest';
          else if (raw.startsWith('~/')) raw = '/home/guest/' + raw.slice(2);
          const full = raw.startsWith('/') ? raw : `${cwd === '/' ? '' : cwd}/${raw}`;
          const parts = full.split('/').filter(Boolean);
          const resolved = [];
          for (const part of parts) {
            if (part === '.') continue;
            if (part === '..') resolved.pop();
            else resolved.push(part);
          }
          return '/' + resolved.join('/');
        },
        getParentAndName(absPath) {
          const parts = absPath.split('/').filter(Boolean);
          if (parts.length === 0) return { parent: null, name: '' };
          const name = parts.pop();
          const parentPath = '/' + parts.join('/');
          return { parent: this.getNode(parentPath), parentPath, name };
        },
        getNode(absPath) {
          const clean = this.normalizePath('/', absPath);
          if (clean === '/') return this.root;
          const parts = clean.split('/').filter(Boolean);
          let curr = this.root;
          for (const part of parts) {
            if (!curr || curr.type !== 'dir' || !curr.children[part]) return null;
            curr = curr.children[part];
          }
          return curr;
        },
        listDir(absPath) {
          const node = this.getNode(absPath);
          if (!node || node.type !== 'dir') return null;
          return Object.entries(node.children).map(([name, item]) => ({
            name,
            path: absPath === '/' ? `/${name}` : `${absPath}/${name}`,
            type: item.type,
            size: item.type === 'file' ? (item.content || '').length : Object.keys(item.children || {}).length,
            updatedAt: item.updatedAt || Date.now()
          })).sort((a, b) => {
            if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
        },
        mkdir(absPath) {
          const clean = this.normalizePath('/', absPath);
          const { parent, name } = this.getParentAndName(clean);
          if (!parent || parent.type !== 'dir') return { ok: false, error: 'Parent directory not found' };
          if (!name || name.includes('/')) return { ok: false, error: 'Invalid folder name' };
          if (parent.children[name]) return { ok: false, error: `Already exists: ${name}` };
          parent.children[name] = { type: 'dir', updatedAt: Date.now(), children: {} };
          parent.updatedAt = Date.now();
          this.persist();
          return { ok: true, path: clean };
        },
        writeFile(absPath, content = '') {
          const clean = this.normalizePath('/', absPath);
          const { parent, name } = this.getParentAndName(clean);
          if (!parent || parent.type !== 'dir') return { ok: false, error: 'Parent directory not found' };
          if (!name) return { ok: false, error: 'Invalid filename' };
          if (parent.children[name] && parent.children[name].type === 'dir') {
            return { ok: false, error: `Cannot overwrite directory: ${name}` };
          }
          parent.children[name] = { type: 'file', content: String(content), updatedAt: Date.now() };
          parent.updatedAt = Date.now();
          this.persist();
          return { ok: true, path: clean };
        },
        touch(absPath) {
          const existing = this.getNode(absPath);
          if (existing) {
            existing.updatedAt = Date.now();
            this.persist();
            return { ok: true, path: absPath };
          }
          return this.writeFile(absPath, '');
        },
        deleteNode(absPath) {
          const clean = this.normalizePath('/', absPath);
          if (clean === '/' || clean === '/home' || clean === '/home/guest') {
            return { ok: false, error: 'Cannot delete protected system directory' };
          }
          const { parent, name } = this.getParentAndName(clean);
          if (!parent || !parent.children[name]) return { ok: false, error: 'No such file or directory' };
          delete parent.children[name];
          parent.updatedAt = Date.now();
          this.persist();
          return { ok: true };
        },
        getAllFiles(startPath = '/home/guest', acc = []) {
          const list = this.listDir(startPath) || [];
          for (const item of list) {
            if (item.type === 'file') acc.push(item.path);
            else if (item.type === 'dir') this.getAllFiles(item.path, acc);
          }
          return acc;
        }
      };

      /* =====================================================================
         SECTION 3: ANIMATED WALLPAPER ENGINE (Aurora Dark, Cyber Grid, Deep Ocean)
         ===================================================================== */
      const WallpaperEngine = {
        canvas: null,
        ctx: null,
        mode: localStorage.getItem('aetheros_wallpaper') || 'aurora',
        rafId: null,
        t: 0,
        particles: [],
        init() {
          this.canvas = document.getElementById('wallpaper-canvas');
          this.ctx = this.canvas.getContext('2d');
          this.resize();
          window.addEventListener('resize', () => this.resize());
          this.initParticles();
          this.setMode(this.mode, false);
          this.loop();
        },
        resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.canvas.width = window.innerWidth * dpr;
          this.canvas.height = window.innerHeight * dpr;
          this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        },
        initParticles() {
          this.particles = Array.from({ length: 55 }, () => ({
            x: Math.random(),
            y: Math.random(),
            r: 1 + Math.random() * 2.5,
            vx: (Math.random() - 0.5) * 0.00025,
            vy: -0.00015 - Math.random() * 0.00035,
            phase: Math.random() * Math.PI * 2
          }));
        },
        setMode(mode, save = true) {
          this.mode = ['aurora', 'cyber', 'ocean'].includes(mode) ? mode : 'aurora';
          if (save) localStorage.setItem('aetheros_wallpaper', this.mode);
          const names = { aurora: 'Aurora Dark', cyber: 'Cyber Grid', ocean: 'Deep Ocean' };
          const label = document.getElementById('wallpaper-label');
          if (label) label.textContent = names[this.mode];
        },
        drawAurora(w, h, t) {
          const ctx = this.ctx;
          ctx.fillStyle = '#060913';
          ctx.fillRect(0, 0, w, h);

          // Soft ambient nebula blobs
          const blobs = [
            { x: w * (0.25 + 0.14 * Math.sin(t * 0.25)), y: h * (0.3 + 0.1 * Math.cos(t * 0.2)), r: Math.max(w, h) * 0.48, c1: 'rgba(14, 165, 233, 0.28)', c2: 'rgba(14, 165, 233, 0)' },
            { x: w * (0.72 + 0.12 * Math.cos(t * 0.22)), y: h * (0.38 + 0.14 * Math.sin(t * 0.18)), r: Math.max(w, h) * 0.52, c1: 'rgba(139, 92, 246, 0.26)', c2: 'rgba(139, 92, 246, 0)' },
            { x: w * (0.5 + 0.18 * Math.sin(t * 0.15 + 1.5)), y: h * (0.72 + 0.08 * Math.cos(t * 0.24)), r: Math.max(w, h) * 0.44, c1: 'rgba(16, 185, 129, 0.20)', c2: 'rgba(16, 185, 129, 0)' }
          ];
          ctx.globalCompositeOperation = 'screen';
          for (const b of blobs) {
            const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
            g.addColorStop(0, b.c1);
            g.addColorStop(1, b.c2);
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
          }

          // Flowing aurora ribbons
          for (let layer = 0; layer < 3; layer++) {
            ctx.beginPath();
            const baseY = h * (0.28 + layer * 0.16);
            ctx.moveTo(0, h);
            for (let x = 0; x <= w; x += 28) {
              const wave = Math.sin(x * 0.0032 + t * (0.45 + layer * 0.12) + layer * 1.7) * 52
                         + Math.cos(x * 0.006 - t * 0.3 + layer) * 24;
              ctx.lineTo(x, baseY + wave);
            }
            ctx.lineTo(w, h);
            ctx.closePath();
            const grad = ctx.createLinearGradient(0, baseY - 70, 0, baseY + 180);
            const colors = [
              ['rgba(56, 189, 248, 0.16)', 'rgba(56, 189, 248, 0)'],
              ['rgba(168, 85, 247, 0.14)', 'rgba(168, 85, 247, 0)'],
              ['rgba(45, 212, 191, 0.12)', 'rgba(45, 212, 191, 0)']
            ][layer];
            grad.addColorStop(0, colors[0]);
            grad.addColorStop(1, colors[1]);
            ctx.fillStyle = grad;
            ctx.fill();
          }
          ctx.globalCompositeOperation = 'source-over';
        },
        drawCyber(w, h, t) {
          const ctx = this.ctx;
          const horizon = h * 0.46;

          // Sky gradient
          const sky = ctx.createLinearGradient(0, 0, 0, horizon);
          sky.addColorStop(0, '#070414');
          sky.addColorStop(0.65, '#190a36');
          sky.addColorStop(1, '#3b0764');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, horizon);

          // Glowing retro sun
          const sunR = Math.min(w, h) * 0.16;
          const sunGrad = ctx.createLinearGradient(w / 2, horizon - sunR * 1.5, w / 2, horizon);
          sunGrad.addColorStop(0, '#f472b6');
          sunGrad.addColorStop(0.55, '#c084fc');
          sunGrad.addColorStop(1, '#38bdf8');
          ctx.save();
          ctx.beginPath();
          ctx.arc(w / 2, horizon - sunR * 0.25, sunR, Math.PI, 0);
          ctx.fillStyle = sunGrad;
          ctx.shadowColor = '#e879f9';
          ctx.shadowBlur = 40;
          ctx.fill();
          ctx.restore();

          // Ground
          const ground = ctx.createLinearGradient(0, horizon, 0, h);
          ground.addColorStop(0, '#120729');
          ground.addColorStop(1, '#05040d');
          ctx.fillStyle = ground;
          ctx.fillRect(0, horizon, w, h - horizon);

          // Perspective Grid Lines
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.28)';
          ctx.lineWidth = 1;
          const cx = w / 2;
          const cols = 18;
          for (let i = -cols; i <= cols; i++) {
            ctx.beginPath();
            ctx.moveTo(cx + i * 24, horizon);
            ctx.lineTo(cx + i * 165, h);
            ctx.stroke();
          }

          // Animated horizontal scrolling lines
          const speed = (t * 0.45) % 1;
          for (let i = 0; i < 16; i++) {
            const p = (i + speed) / 16;
            const y = horizon + Math.pow(p, 2.35) * (h - horizon);
            ctx.strokeStyle = `rgba(232, 121, 249, ${0.12 + p * 0.42})`;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          // Horizon glow line
          ctx.strokeStyle = 'rgba(244, 114, 182, 0.75)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, horizon);
          ctx.lineTo(w, horizon);
          ctx.stroke();
        },
        drawOcean(w, h, t) {
          const ctx = this.ctx;
          const bg = ctx.createLinearGradient(0, 0, 0, h);
          bg.addColorStop(0, '#041d2e');
          bg.addColorStop(0.5, '#061529');
          bg.addColorStop(1, '#030816');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, w, h);

          // Soft underwater caustic light rays from top
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          for (let i = 0; i < 6; i++) {
            const rx = w * (0.12 + i * 0.16) + Math.sin(t * 0.35 + i) * 45;
            const rayW = 70 + (i % 3) * 35;
            const grad = ctx.createLinearGradient(rx, 0, rx + 80, h * 0.85);
            grad.addColorStop(0, 'rgba(45, 212, 191, 0.14)');
            grad.addColorStop(0.6, 'rgba(14, 165, 233, 0.05)');
            grad.addColorStop(1, 'rgba(14, 165, 233, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(rx - rayW * 0.4, 0);
            ctx.lineTo(rx + rayW * 0.4, 0);
            ctx.lineTo(rx + rayW * 1.9, h * 0.9);
            ctx.lineTo(rx - rayW * 0.7, h * 0.9);
            ctx.closePath();
            ctx.fill();
          }

          // Drifting bioluminescent particles
          for (const p of this.particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
            if (p.x < 0) p.x = 1;
            if (p.x > 1) p.x = 0;
            const alpha = 0.25 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.8 + p.phase));
            ctx.beginPath();
            ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(94, 234, 212, ${alpha})`;
            ctx.fill();
          }
          ctx.restore();
        },
        loop() {
          this.t += 0.016;
          const w = window.innerWidth;
          const h = window.innerHeight;
          if (this.mode === 'aurora') this.drawAurora(w, h, this.t);
          else if (this.mode === 'cyber') this.drawCyber(w, h, this.t);
          else this.drawOcean(w, h, this.t);
          this.rafId = requestAnimationFrame(() => this.loop());
        }
      };

      /* =====================================================================
         SECTION 4: WINDOW MANAGER
         ===================================================================== */
      const WindowManager = {
        windows: new Map(), // id -> winObj
        nextPid: 1001,
        topZ: 100,
        focusedId: null,
        layer: null,
        shield: null,

        init() {
          this.layer = document.getElementById('window-layer');
          this.shield = document.getElementById('drag-shield');
        },

        openApp(appId, params = {}) {
          const def = AppRegistry[appId];
          if (!def) return null;

          // If single-instance app already open and no special file override, focus/restore it
          if (def.singleton) {
            for (const win of this.windows.values()) {
              if (win.appId === appId) {
                if (win.minimized) this.restore(win.id);
                this.focus(win.id);
                if (win.instance && typeof win.instance.onParams === 'function') {
                  win.instance.onParams(params);
                }
                return win;
              }
            }
          }

          const pid = this.nextPid++;
          const id = `win-${pid}`;
          const vw = window.innerWidth;
          const vh = window.innerHeight - 32; // below top bar

          // Compute sensible responsive size & cascade position
          const width = Math.min(def.defaultWidth || 680, Math.max(320, vw - 24));
          const height = Math.min(def.defaultHeight || 460, Math.max(280, vh - 96));
          const offset = (this.windows.size % 6) * 26;
          const left = Math.max(12, Math.min(vw - width - 12, Math.round((vw - width) / 2) + offset - 30));
          const top = Math.max(12, Math.min(vh - height - 80, Math.round((vh - height) / 2) + offset - 30));

          const el = document.createElement('section');
          el.id = id;
          el.className = 'os-window glass-window opening absolute rounded-2xl flex flex-col overflow-hidden pointer-events-auto';
          el.style.width = `${width}px`;
          el.style.height = `${height}px`;
          el.style.left = `${left}px`;
          el.style.top = `${top}px`;
          el.style.zIndex = ++this.topZ;

          el.innerHTML = `
            <div class="win-titlebar h-10 px-3.5 flex items-center justify-between bg-white/[0.04] border-b border-white/10 cursor-grab active:cursor-grabbing shrink-0 select-none">
              <div class="flex items-center gap-2">
                <button class="win-btn-close w-3 h-3 rounded-full bg-rose-500 hover:bg-rose-400 transition-colors flex items-center justify-center group" title="Close">
                  <span class="text-[8px] font-bold text-rose-950 opacity-0 group-hover:opacity-100 leading-none">×</span>
                </button>
                <button class="win-btn-min w-3 h-3 rounded-full bg-amber-400 hover:bg-amber-300 transition-colors flex items-center justify-center group" title="Minimize">
                  <span class="text-[8px] font-bold text-amber-950 opacity-0 group-hover:opacity-100 leading-none">−</span>
                </button>
                <button class="win-btn-max w-3 h-3 rounded-full bg-emerald-500 hover:bg-emerald-400 transition-colors flex items-center justify-center group" title="Maximize / Restore">
                  <span class="text-[8px] font-bold text-emerald-950 opacity-0 group-hover:opacity-100 leading-none">+</span>
                </button>
              </div>
              <div class="win-title flex items-center gap-2 text-xs font-semibold text-slate-200 truncate px-2 pointer-events-none">
                <span class="win-title-text truncate">${Utils.escapeHtml(def.title)}</span>
              </div>
              <div class="w-12 text-right font-mono text-[10px] text-slate-500">PID ${pid}</div>
            </div>
            <div class="win-body flex-1 min-h-0 overflow-hidden relative flex flex-col"></div>
            <div class="win-resize-handle absolute bottom-0 right-0 w-4 h-4 cursor-nwse-resize z-20 flex items-end justify-end p-0.5 opacity-60 hover:opacity-100">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M9 1L1 9M9 5L5 9" stroke="rgba(148,163,184,0.8)" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </div>
          `;

          const winObj = {
            id,
            pid,
            appId,
            title: def.title,
            el,
            bodyEl: el.querySelector('.win-body'),
            titleEl: el.querySelector('.win-title-text'),
            minimized: false,
            maximized: false,
            prevRect: null,
            minW: def.minWidth || 340,
            minH: def.minHeight || 260,
            instance: null,
            setTitle(newTitle) {
              this.title = newTitle;
              this.titleEl.textContent = newTitle;
              if (WindowManager.focusedId === this.id) {
                WindowManager.updateActiveLabel();
              }
              EventBus.emit('wm:change');
            }
          };

          this.windows.set(id, winObj);
          this.layer.appendChild(el);
          setTimeout(() => el.classList.remove('opening'), 220);

          // Bind window controls & interactions
          this.bindWindowEvents(winObj);

          // Mount App inside window body
          try {
            winObj.instance = def.mount(winObj, params) || {};
          } catch (err) {
            console.error(`Failed to mount ${appId}:`, err);
            winObj.bodyEl.innerHTML = `<div class="p-4 text-rose-400 text-xs font-mono">App Error: ${Utils.escapeHtml(err.message)}</div>`;
          }

          this.focus(id);
          EventBus.emit('wm:change');
          return winObj;
        },

        bindWindowEvents(win) {
          const { el } = win;
          const titlebar = el.querySelector('.win-titlebar');
          const resizeHandle = el.querySelector('.win-resize-handle');

          // Focus on any pointerdown inside window
          el.addEventListener('pointerdown', () => {
            if (this.focusedId !== win.id) this.focus(win.id);
          });

          // Controls
          el.querySelector('.win-btn-close').addEventListener('click', (e) => {
            e.stopPropagation();
            this.close(win.id);
          });
          el.querySelector('.win-btn-min').addEventListener('click', (e) => {
            e.stopPropagation();
            this.minimize(win.id);
          });
          el.querySelector('.win-btn-max').addEventListener('click', (e) => {
            e.stopPropagation();
            this.toggleMaximize(win.id);
          });
          titlebar.addEventListener('dblclick', (e) => {
            if (e.target.closest('button')) return;
            this.toggleMaximize(win.id);
          });

          // Smooth Dragging via Titlebar with Drag Shield
          titlebar.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.button !== 0) return;
            if (win.maximized) return;
            e.preventDefault();
            this.focus(win.id);

            const startX = e.clientX;
            const startY = e.clientY;
            const startLeft = parseFloat(el.style.left) || 0;
            const startTop = parseFloat(el.style.top) || 0;

            el.classList.add('dragging');
            this.shield.classList.remove('hidden');
            this.shield.style.cursor = 'grabbing';

            const onMove = (ev) => {
              const dx = ev.clientX - startX;
              const dy = ev.clientY - startY;
              const maxTop = window.innerHeight - 32 - 44;
              const minLeft = -(el.offsetWidth - 80);
              const maxLeft = window.innerWidth - 80;
              const nextLeft = Math.max(minLeft, Math.min(maxLeft, startLeft + dx));
              const nextTop = Math.max(0, Math.min(maxTop, startTop + dy));
              el.style.left = `${nextLeft}px`;
              el.style.top = `${nextTop}px`;
            };

            const onUp = () => {
              el.classList.remove('dragging');
              this.shield.classList.add('hidden');
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
          });

          // Smooth Corner Resizing with Drag Shield
          resizeHandle.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || win.maximized) return;
            e.preventDefault();
            e.stopPropagation();
            this.focus(win.id);

            const startX = e.clientX;
            const startY = e.clientY;
            const startW = el.offsetWidth;
            const startH = el.offsetHeight;

            el.classList.add('resizing');
            this.shield.classList.remove('hidden');
            this.shield.style.cursor = 'nwse-resize';

            const onMove = (ev) => {
              const nextW = Math.max(win.minW, Math.min(window.innerWidth - 16, startW + (ev.clientX - startX)));
              const nextH = Math.max(win.minH, Math.min(window.innerHeight - 48, startH + (ev.clientY - startY)));
              el.style.width = `${nextW}px`;
              el.style.height = `${nextH}px`;
              if (win.instance && typeof win.instance.onResize === 'function') {
                win.instance.onResize();
              }
            };

            const onUp = () => {
              el.classList.remove('resizing');
              this.shield.classList.add('hidden');
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
          });
        },

        focus(id) {
          const prev = this.windows.get(this.focusedId);
          if (prev && prev.id !== id) {
            prev.el.classList.remove('focused');
            if (prev.instance && typeof prev.instance.onBlur === 'function') prev.instance.onBlur();
          }
          const win = this.windows.get(id);
          if (!win) {
            this.focusedId = null;
            this.updateActiveLabel();
            EventBus.emit('wm:change');
            return;
          }
          win.el.style.zIndex = ++this.topZ;
          win.el.classList.add('focused');
          this.focusedId = id;
          if (win.instance && typeof win.instance.onFocus === 'function') win.instance.onFocus();
          this.updateActiveLabel();
          EventBus.emit('wm:change');
        },

        minimize(id) {
          const win = this.windows.get(id);
          if (!win) return;
          win.minimized = true;
          win.el.classList.add('minimized');
          win.el.classList.remove('focused');
          if (win.instance && typeof win.instance.onBlur === 'function') win.instance.onBlur();
          if (this.focusedId === id) {
            this.focusNextAvailable();
          }
          EventBus.emit('wm:change');
        },

        restore(id) {
          const win = this.windows.get(id);
          if (!win) return;
          win.minimized = false;
          win.el.classList.remove('minimized');
          this.focus(id);
          EventBus.emit('wm:change');
        },

        toggleMaximize(id) {
          const win = this.windows.get(id);
          if (!win) return;
          if (!win.maximized) {
            win.prevRect = {
              left: win.el.style.left,
              top: win.el.style.top,
              width: win.el.style.width,
              height: win.el.style.height
            };
            win.maximized = true;
            win.el.style.left = '8px';
            win.el.style.top = '8px';
            win.el.style.width = 'calc(100% - 16px)';
            win.el.style.height = 'calc(100% - 86px)';
          } else {
            win.maximized = false;
            if (win.prevRect) {
              win.el.style.left = win.prevRect.left;
              win.el.style.top = win.prevRect.top;
              win.el.style.width = win.prevRect.width;
              win.el.style.height = win.prevRect.height;
            }
          }
          if (win.instance && typeof win.instance.onResize === 'function') {
            setTimeout(() => win.instance.onResize(), 230);
          }
        },

        close(id) {
          const win = this.windows.get(id);
          if (!win) return;
          if (win.instance && typeof win.instance.onClose === 'function') {
            try { win.instance.onClose(); } catch (e) { console.error(e); }
          }
          win.el.remove();
          this.windows.delete(id);
          if (this.focusedId === id) {
            this.focusNextAvailable();
          }
          EventBus.emit('wm:change');
        },

        focusNextAvailable() {
          let topWin = null;
          let maxZ = -1;
          for (const w of this.windows.values()) {
            if (!w.minimized) {
              const z = parseInt(w.el.style.zIndex || '0', 10);
              if (z > maxZ) { maxZ = z; topWin = w; }
            }
          }
          if (topWin) this.focus(topWin.id);
          else {
            this.focusedId = null;
            this.updateActiveLabel();
          }
        },

        updateActiveLabel() {
          const label = document.getElementById('active-app-label');
          if (!label) return;
          const win = this.windows.get(this.focusedId);
          label.textContent = win ? win.title : 'Desktop';
        },

        handleDockClick(appId) {
          const openWins = Array.from(this.windows.values()).filter(w => w.appId === appId);
          if (openWins.length === 0) {
            this.openApp(appId);
            return;
          }
          const latest = openWins[openWins.length - 1];
          if (latest.minimized) {
            this.restore(latest.id);
          } else if (this.focusedId === latest.id) {
            this.minimize(latest.id);
          } else {
            this.focus(latest.id);
          }
        }
      };

      /* ---------------------------------------------------------------------

      function mountTerminal(win) {
        let cwd = '/home/guest';
        const history = [];
        let historyIdx = -1;

        win.bodyEl.innerHTML = `
          <div class="term-root flex-1 flex flex-col bg-[#060913]/90 font-mono text-xs sm:text-[13px] text-slate-200 p-3 overflow-y-auto cursor-text selectable">
            <div class="term-output space-y-1.5 whitespace-pre-wrap break-words leading-relaxed"></div>
            <div class="flex items-center gap-2 mt-2 shrink-0">
              <span class="term-prompt text-emerald-400 font-semibold shrink-0">guest@aether:~$</span>
              <input type="text" class="term-input flex-1 bg-transparent border-none outline-none text-slate-100 caret-sky-400" autocomplete="off" spellcheck="false" aria-label="Terminal command input" />
            </div>
          </div>
        `;

        const root = win.bodyEl.querySelector('.term-root');
        const output = win.bodyEl.querySelector('.term-output');
        const promptEl = win.bodyEl.querySelector('.term-prompt');
        const input = win.bodyEl.querySelector('.term-input');

        const formatPromptPath = (p) => p === '/home/guest' ? '~' : p.startsWith('/home/guest/') ? '~' + p.slice(11) : p;
        const updatePrompt = () => {
          promptEl.textContent = `guest@aether:${formatPromptPath(cwd)}$`;
          win.setTitle(`Terminal — ${formatPromptPath(cwd)}`);
        };

        const print = (html, isHtml = false) => {
          const line = document.createElement('div');
          if (isHtml) line.innerHTML = html;
          else line.textContent = html;
          output.appendChild(line);
          root.scrollTop = root.scrollHeight;
        };

        print(`<span class="text-sky-400 font-semibold">AetherOS Shell v2.4.0</span> <span class="text-slate-400">— Type <span class="text-amber-300">help</span> for available commands.</span>`, true);

        const runCommand = (rawLine) => {
          const line = rawLine.trim();
          print(`<span class="text-emerald-400 font-semibold">${Utils.escapeHtml(promptEl.textContent)}</span> <span class="text-white">${Utils.escapeHtml(rawLine)}</span>`, true);
          if (!line) return;

          history.push(line);
          historyIdx = history.length;

          // Handle output redirection: echo <text> > <file> or >>
          const redirMatch = line.match(/^echo\s+([\s\S]+?)\s*(>>?)\s*(\S+)$/);
          if (redirMatch) {
            let text = redirMatch[1].trim();
            if ((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))) {
              text = text.slice(1, -1);
            }
            const op = redirMatch[2];
            const targetPath = VFS.normalizePath(cwd, redirMatch[3]);
            let finalContent = text;
            if (op === '>>') {
              const existing = VFS.getNode(targetPath);
              if (existing && existing.type === 'file') {
                finalContent = (existing.content ? existing.content + '\n' : '') + text;
              }
            }
            const res = VFS.writeFile(targetPath, finalContent);
            if (!res.ok) print(`<span class="text-rose-400">echo: ${Utils.escapeHtml(res.error)}</span>`, true);
            return;
          }

          // Basic argument tokenizer supporting quotes
          const tokens = [];
          let current = '';
          let quote = null;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (quote) {
              if (ch === quote) quote = null;
              else current += ch;
            } else if (ch === '"' || ch === "'") {
              quote = ch;
            } else if (/\s/.test(ch)) {
              if (current) { tokens.push(current); current = ''; }
            } else {
              current += ch;
            }
          }
          if (current) tokens.push(current);

          const cmd = tokens[0];
          const args = tokens.slice(1);

          switch (cmd) {
            case 'help':
              print([
                '<span class="text-sky-300 font-semibold">Available Commands:</span>',
                '  <span class="text-amber-300">ls [path]</span>               List directory contents',
                '  <span class="text-amber-300">cd [path]</span>               Change working directory',
                '  <span class="text-amber-300">pwd</span>                     Print working directory',
                '  <span class="text-amber-300">mkdir &lt;dir&gt;</span>             Create a new directory',
                '  <span class="text-amber-300">touch &lt;file&gt;</span>            Create an empty file',
                '  <span class="text-amber-300">cat &lt;file&gt;</span>              Display file contents',
                '  <span class="text-amber-300">rm &lt;path&gt;</span>               Remove file or directory',
                '  <span class="text-amber-300">echo &lt;text&gt; &gt; &lt;file&gt;</span>   Write text to a file',
                '  <span class="text-amber-300">open &lt;file&gt;</span>             Open file in CodePad',
                '  <span class="text-amber-300">neofetch</span>                Show AetherOS system info',
                '  <span class="text-amber-300">whoami</span> / <span class="text-amber-300">date</span> / <span class="text-amber-300">clear</span>   System utilities'
              ].join('\n'), true);
              break;

            case 'pwd':
              print(cwd);
              break;

            case 'whoami':
              print('guest');
              break;

            case 'date':
              print(new Date().toString());
              break;

            case 'clear':
              output.innerHTML = '';
              break;

            case 'echo':
              print(args.join(' '));
              break;

            case 'ls': {
              const target = args[0] && !args[0].startsWith('-') ? VFS.normalizePath(cwd, args[0]) : cwd;
              const items = VFS.listDir(target);
              if (!items) {
                print(`<span class="text-rose-400">ls: cannot access '${Utils.escapeHtml(args[0] || target)}': No such directory</span>`, true);
              } else if (items.length === 0) {
                print('<span class="text-slate-500">(empty directory)</span>', true);
              } else {
                const html = items.map(it =>
                  it.type === 'dir'
                    ? `<span class="text-sky-400 font-semibold">${Utils.escapeHtml(it.name)}/</span>`
                    : `<span class="text-slate-200">${Utils.escapeHtml(it.name)}</span>`
                ).join('   ');
                print(html, true);
              }
              break;
            }

            case 'cd': {
              const target = args[0] ? VFS.normalizePath(cwd, args[0]) : '/home/guest';
              const node = VFS.getNode(target);
              if (!node) print(`<span class="text-rose-400">cd: no such file or directory: ${Utils.escapeHtml(args[0])}</span>`, true);
              else if (node.type !== 'dir') print(`<span class="text-rose-400">cd: not a directory: ${Utils.escapeHtml(args[0])}</span>`, true);
              else {
                cwd = target;
                updatePrompt();
              }
              break;
            }

            case 'mkdir': {
              if (!args[0]) { print('<span class="text-rose-400">mkdir: missing operand</span>', true); break; }
              const res = VFS.mkdir(VFS.normalizePath(cwd, args[0]));
              if (!res.ok) print(`<span class="text-rose-400">mkdir: ${Utils.escapeHtml(res.error)}</span>`, true);
              break;
            }

            case 'touch': {
              if (!args[0]) { print('<span class="text-rose-400">touch: missing file operand</span>', true); break; }
              const res = VFS.touch(VFS.normalizePath(cwd, args[0]));
              if (!res.ok) print(`<span class="text-rose-400">touch: ${Utils.escapeHtml(res.error)}</span>`, true);
              break;
            }

            case 'cat': {
              if (!args[0]) { print('<span class="text-rose-400">cat: missing file operand</span>', true); break; }
              const node = VFS.getNode(VFS.normalizePath(cwd, args[0]));
              if (!node) print(`<span class="text-rose-400">cat: ${Utils.escapeHtml(args[0])}: No such file</span>`, true);
              else if (node.type === 'dir') print(`<span class="text-rose-400">cat: ${Utils.escapeHtml(args[0])}: Is a directory</span>`, true);
              else print(node.content || '');
              break;
            }

            case 'rm': {
              if (!args[0]) { print('<span class="text-rose-400">rm: missing operand</span>', true); break; }
              const res = VFS.deleteNode(VFS.normalizePath(cwd, args[0]));
              if (!res.ok) print(`<span class="text-rose-400">rm: ${Utils.escapeHtml(res.error)}</span>`, true);
              break;
            }

            case 'open': {
              if (!args[0]) { print('<span class="text-rose-400">open: specify a file path</span>', true); break; }
              const targetPath = VFS.normalizePath(cwd, args[0]);
              const node = VFS.getNode(targetPath);
              if (node && node.type === 'dir') {
                print(`<span class="text-rose-400">open: '${Utils.escapeHtml(args[0])}' is a directory</span>`, true);
                break;
              }
              if (!node) VFS.touch(targetPath);
              WindowManager.openApp('codepad', { filePath: targetPath });
              print(`<span class="text-emerald-400">Launched CodePad → ${Utils.escapeHtml(targetPath)}</span>`, true);
              break;
            }

            case 'neofetch': {
              const uptimeSec = Math.floor((Date.now() - OS_BOOT_TIME) / 1000);
              const mins = Math.floor(uptimeSec / 60);
              const secs = uptimeSec % 60;
              const ascii = [
                '      /\\        ',
                '     /  \\       ',
                '    / /\\ \\      ',
                '   / ____ \\     ',
                '  /_/    \\_\\    ',
                '  A E T H E R   '
              ];
              const info = [
                `<span class="text-sky-400 font-bold">guest@aether</span>`,
                `<span class="text-slate-500">--------------------</span>`,
                `<span class="text-sky-300 font-semibold">OS:</span> AetherOS 2.4 WebDesktop`,
                `<span class="text-sky-300 font-semibold">Kernel:</span> HTML5 / V8 Engine`,
                `<span class="text-sky-300 font-semibold">Uptime:</span> ${mins}m ${secs}s`,
                `<span class="text-sky-300 font-semibold">Resolution:</span> ${window.innerWidth}x${window.innerHeight}`,
                `<span class="text-sky-300 font-semibold">Windows:</span> ${WindowManager.windows.size} active`,
                `<span class="text-sky-300 font-semibold">Theme:</span> Glassmorphic Dark`
              ];
              let out = '';
              for (let i = 0; i < Math.max(ascii.length, info.length); i++) {
                const a = ascii[i] || '                ';
                const b = info[i] || '';
                out += `<span class="text-indigo-400 font-bold">${Utils.escapeHtml(a)}</span>  ${b}\n`;
              }
              print(out, true);
              break;
            }

            default:
              print(`<span class="text-rose-400">aether-sh: command not found: ${Utils.escapeHtml(cmd)}</span>`, true);
          }
        };

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const val = input.value;
            input.value = '';
            runCommand(val);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (history.length > 0 && historyIdx > 0) {
              historyIdx--;
              input.value = history[historyIdx];
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIdx < history.length - 1) {
              historyIdx++;
              input.value = history[historyIdx];
            } else {
              historyIdx = history.length;
              input.value = '';
            }
          } else if (e.key === 'Tab') {
            e.preventDefault();
            const parts = input.value.split(/\s+/);
            const last = parts[parts.length - 1] || '';
            const items = VFS.listDir(cwd) || [];
            const match = items.find(it => it.name.toLowerCase().startsWith(last.toLowerCase()));
            if (match) {
              parts[parts.length - 1] = match.name;
              input.value = parts.join(' ');
            }
          }
        });

        root.addEventListener('click', () => {
          const sel = window.getSelection();
          if (!sel || sel.toString().length === 0) input.focus();
        });

        updatePrompt();
        setTimeout(() => input.focus(), 50);

        return {
          onFocus() { input.focus(); }
        };
      }

        const openCreateBar = (mode) => {
          createMode = mode;
          createLabel.textContent = mode === 'dir' ? 'New Folder:' : 'New File:';
          createInput.placeholder = mode === 'dir' ? 'FolderName' : 'notes.md';
          createInput.value = '';
          createBar.classList.remove('hidden');
          createInput.focus();
        };

        const closeCreateBar = () => {
          createMode = null;
          createBar.classList.add('hidden');
        };

        const submitCreate = () => {
          const name = createInput.value.trim();
          if (!name) return;
          const target = VFS.normalizePath(currentPath, name);
          const res = createMode === 'dir' ? VFS.mkdir(target) : VFS.writeFile(target, '');
          if (!res.ok) Utils.toast(res.error, 'error');
          else {
            Utils.toast(`Created ${name}`, 'success');
            closeCreateBar();
          }
        };

        win.bodyEl.querySelector('.files-up').addEventListener('click', () => {
          currentPath = VFS.normalizePath(currentPath, '..');
          selectedPath = null;
          render();
        });
        win.bodyEl.querySelector('.files-new-file').addEventListener('click', () => openCreateBar('file'));
        win.bodyEl.querySelector('.files-new-dir').addEventListener('click', () => openCreateBar('dir'));
        win.bodyEl.querySelector('.files-create-confirm').addEventListener('click', submitCreate);
        win.bodyEl.querySelector('.files-create-cancel').addEventListener('click', closeCreateBar);
        createInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') submitCreate();
          if (e.key === 'Escape') closeCreateBar();
        });

        deleteBtn.addEventListener('click', () => {
          if (!selectedPath) return;
          const res = VFS.deleteNode(selectedPath);
          if (!res.ok) Utils.toast(res.error, 'error');
          else {
            Utils.toast('Deleted item', 'info');
            selectedPath = null;
          }
        });

        win.bodyEl.querySelectorAll('.files-nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (VFS.getNode(btn.dataset.nav)) {
              currentPath = btn.dataset.nav;
              selectedPath = null;
              render();
            }
          });
        });

        listEl.addEventListener('click', () => {
          if (selectedPath) { selectedPath = null; render(); }
        });

        const unsub = EventBus.on('vfs:change', render);
        render();

        return {
          onClose() { unsub(); }
        };
      }

      /* ---------------------------------------------------------------------
         APP 3: CODEPAD (Markdown & Text Editor)
         --------------------------------------------------------------------- */
      function renderMarkdown(md) {
        const escaped = Utils.escapeHtml(md || '');
        const codeBlocks = [];
        let html = escaped.replace(/```([\s\S]*?)```/g, (_, code) => {
          const idx = codeBlocks.length;
          codeBlocks.push(`<pre><code>${code.replace(/^\n/, '')}</code></pre>`);
          return `@@CODEBLOCK_${idx}@@`;
        });

        const lines = html.split('\n');
        const out = [];
        let inUl = false;
        let inOl = false;

        const closeLists = () => {
          if (inUl) { out.push('</ul>'); inUl = false; }
          if (inOl) { out.push('</ol>'); inOl = false; }
        };

        const inlineFormat = (s) => s
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        for (const rawLine of lines) {
          const line = rawLine;
          if (/^@@CODEBLOCK_\d+@@$/.test(line.trim())) {
            closeLists();
            out.push(line.trim());
          } else if (/^###\s+(.*)/.test(line)) {
            closeLists();
            out.push(`<h3>${inlineFormat(line.replace(/^###\s+/, ''))}</h3>`);
          } else if (/^##\s+(.*)/.test(line)) {
            closeLists();
            out.push(`<h2>${inlineFormat(line.replace(/^##\s+/, ''))}</h2>`);
          } else if (/^#\s+(.*)/.test(line)) {
            closeLists();
            out.push(`<h1>${inlineFormat(line.replace(/^#\s+/, ''))}</h1>`);
          } else if (/^&gt;\s?(.*)/.test(line)) {
            closeLists();
            out.push(`<blockquote>${inlineFormat(line.replace(/^&gt;\s?/, ''))}</blockquote>`);
          } else if (/^---+$/.test(line.trim())) {
            closeLists();
            out.push('<hr/>');
          } else if (/^[-*]\s+(.*)/.test(line)) {
            if (inOl) { out.push('</ol>'); inOl = false; }
            if (!inUl) { out.push('<ul>'); inUl = true; }
            out.push(`<li>${inlineFormat(line.replace(/^[-*]\s+/, ''))}</li>`);
          } else if (/^\d+\.\s+(.*)/.test(line)) {
            if (inUl) { out.push('</ul>'); inUl = false; }
            if (!inOl) { out.push('<ol>'); inOl = true; }
            out.push(`<li>${inlineFormat(line.replace(/^\d+\.\s+/, ''))}</li>`);
          } else if (line.trim() === '') {
            closeLists();
          } else {
            closeLists();
            out.push(`<p>${inlineFormat(line)}</p>`);
          }
        }
        closeLists();

        let finalHtml = out.join('\n');
        codeBlocks.forEach((block, i) => {
          finalHtml = finalHtml.replace(`@@CODEBLOCK_${i}@@`, block);
        });
        return finalHtml;
      }

          pathEl.textContent = currentFile;

            e.preventDefault();

            const end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
